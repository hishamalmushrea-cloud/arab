name: Schema 2.0.0 validation
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile dependency-free tools
        run: python3 -m compileall -q scripts
      - name: Run Schema 2.0.0 migration and all accepted country gates
  run: make check
