name: Schema v1 validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile dependency-free tools
        run: python3 -m compileall -q scripts
      - name: Run Phase 0, Phase 1, and Tunisia Phase 2 gates
        run: make check
